name: One-Time-Off browser QA
on:
  pull_request:
    branches: [main]
  push:
    branches: [codex/phase1-one-time-saving]
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.52.0
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser_qa.cjs
      - run: node tests/browser_pwa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: one-time-off-browser-screenshots
          path: screenshots/
          if-no-files-found: ignore
