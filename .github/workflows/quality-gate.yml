name: AVA One-Time Saving Quality Gate
on:
  pull_request:
    branches: [main]
  push:
    branches: [codex/phase1-one-time-saving]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  data-and-safety:
    name: Validate sheet snapshot and safety invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify App version increment against base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          node tools/check-release-governance.mjs
      - name: Verify published release metadata
        if: github.event_name != 'pull_request'
        run: node tools/check-release-governance.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run contract checks
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Test read-only Sheets adapter
        run: |
          node tests/test_sheets_readonly.mjs
          node tests/test_gas_contract.mjs
          node tests/test_gas_actions.mjs
          node tests/test_gas_integration.mjs
          node tests/test_gas_owner_examples.mjs
          node tests/test_admin_readiness.mjs
          node tests/test_pages_build.mjs
          node tests/test_staging_build.mjs
          node tests/test_staging_gateway.mjs
      - name: Ensure no production/credential secrets in tracked files
        shell: bash
        run: |
          ! git grep -nE '(-----BEGIN (RSA|OPENSSH|PRIVATE) KEY-----|AIza[0-9A-Za-z_-]{30,}|ghp_[A-Za-z0-9]{30,})' -- ':!*.md'
